name: C++

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v5
      - name: Update submodules
        run: git submodule update --init --recursive
      # ADR 0005: this is an algorithm component — no hardware component may
      # appear in its dependency tree. Guard against regression.
      - name: Assert the dependency tree is hardware-free
        run: |
          test ! -d third_party/xmDriver
          ! grep -rq "xmdriver" src/ CMakeLists.txt cmake/
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev \
           libglfw3-dev libcairo2-dev libtbb-dev libboost-all-dev \
           libeigen3-dev libopencv-dev libyaml-cpp-dev \
           libncurses-dev libpcl-dev libglm-dev
      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build
      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DXMOTION_WERROR=ON
      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # let each distro finish: a compiler-specific failure on one must not
      # cancel (and mask) the other's result
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev \
           libglfw3-dev libcairo2-dev libtbb-dev libboost-all-dev \
           libeigen3-dev libopencv-dev libyaml-cpp-dev \
           libncurses-dev libpcl-dev libglm-dev
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build
      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_TESTING=ON -DXMOTION_WERROR=ON
      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE
      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -LE "campaign|allocation" --output-on-failure

  # macOS coverage: AppleClang + libc++ on arm64. Clang reports a set of
  # diagnostics GCC does not (-Wunused-private-field,
  # -Wdelete-non-abstract-non-virtual-dtor), so this lane is what keeps the
  # -Werror build honest beyond GCC's warning set. It also exercises the
  # MPPI sampler's cross-platform reproducibility, which is the whole point
  # of PortableNormal.
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Install dependencies
        # eigen@3 and opencv@4 are keg-only: Homebrew defaults to Eigen 5 and
        # OpenCV 5, and this project targets the 3.x/4.x APIs.
        run: brew install eigen@3 opencv@4 pcl boost abseil re2 glm glfw cairo fontconfig
      - name: Configure CMake
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DBUILD_TESTING=ON -DXMOTION_WERROR=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3);$(brew --prefix opencv@4)"
      - name: Build
        shell: bash
        run: cmake --build build -j"$(sysctl -n hw.ncpu)" --config $BUILD_TYPE
      - name: Test
        working-directory: build
        shell: bash
        run: ctest --output-on-failure --no-tests=error

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev \
           libglfw3-dev libcairo2-dev libtbb-dev libboost-all-dev \
           libeigen3-dev libopencv-dev libyaml-cpp-dev \
           libncurses-dev libpcl-dev libglm-dev
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Configure CMake (ASan + UBSan)
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DENABLE_VISUALIZATION=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Test
        working-directory: build
        shell: bash
        run: ctest -LE "campaign|allocation" --output-on-failure
